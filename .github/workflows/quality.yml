name: quality

on:
  push:
    branches: [main, master, 'chore/**', 'fix/**', 'refactor/**']
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run npm run quality
        shell: bash
        run: set -o pipefail && npm run quality 2>&1 | tee quality.log
      - name: Upload quality log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.os }}-node${{ matrix.node }}
          path: quality.log
          if-no-files-found: ignore
      - run: npm pack --dry-run --json
      - name: serialport load smoke
        shell: bash
        run: node -e "import('serialport').then(()=>console.log('serialport ok')).catch(e=>{console.error(e); process.exit(1)})"
