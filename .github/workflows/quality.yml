name: quality

on:
  push:
    branches: [main, master, 'chore/**', 'fix/**', 'refactor/**']
  pull_request:

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run deps:check
      - run: npm test
      - run: npm pack --dry-run --json
      - name: serialport load smoke
        shell: bash
        run: node -e "import('serialport').then(()=>console.log('serialport ok')).catch(e=>{console.error(e); process.exit(1)})"
